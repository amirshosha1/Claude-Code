<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b02418">
<title>Grande Punto — Automotive OS</title>


<style>
/* ==== css/theme.css ==== */
/* ============================================================
   THEME — design tokens + base + paper texture (dossier look)
   Shared across every module. Dark mode via [data-theme].
   ============================================================ */
:root{
  --paper:#ece5d6; --card:#f6f1e6; --card2:#efe8d8;
  --ink:#211c17; --ink-soft:#6c6355; --line:#c9bfa8; --line-strong:#a89b7d;
  --rosso:#b02418; --rosso-deep:#7c1710; --amber:#c07a12; --olive:#5c6b3a;
  --steel:#3f6377; --green:#4a6d2f; --violet:#6b4a8f;
  --shadow:rgba(33,28,23,.10);
  --mono:ui-monospace,'Roboto Mono','SF Mono',Menlo,Consolas,monospace;
  --disp:'Arial Narrow','Roboto Condensed','Oswald',system-ui,sans-serif;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:9px; --gap:16px;
}
:root[data-theme="dark"]{
  --paper:#15130f; --card:#1e1a15; --card2:#242019;
  --ink:#ece5d6; --ink-soft:#9a917f; --line:#3a3428; --line-strong:#52493a;
  --rosso:#e2564a; --rosso-deep:#b03428; --amber:#e0a24a; --olive:#8aa05a;
  --steel:#6ba3bd; --green:#8fc06a; --violet:#a98cd0;
  --shadow:rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background-image:
    linear-gradient(rgba(120,110,85,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,110,85,.08) 1px,transparent 1px);
  background-size:26px 26px;
}
body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.03;
  background-image:radial-gradient(#000 .6px,transparent .6px); background-size:3px 3px; }
:root[data-theme="dark"] body::after{ opacity:.06; background-image:radial-gradient(#fff .6px,transparent .6px); }

a{color:inherit}
::selection{background:var(--rosso); color:var(--paper)}
:focus-visible{outline:2px solid var(--rosso); outline-offset:2px}

.mono{font-family:var(--mono)}
.disp{font-family:var(--disp)}
.rtl{direction:rtl; text-align:right}
.muted{color:var(--ink-soft)}
.rosso{color:var(--rosso)}
.hidden{display:none !important}

/* headings shared */
.h-disp{font-family:var(--disp); font-weight:700; text-transform:uppercase; letter-spacing:.04em; line-height:1}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}

</style>
<style>
/* ==== css/components.css ==== */
/* ============================================================
   COMPONENTS — reusable UI primitives
   ============================================================ */

/* cards */
.card{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r);
  box-shadow:4px 4px 0 var(--shadow); position:relative; overflow:hidden}
.card .spine{height:6px}
.card .pad{padding:14px 16px}
.card-hover{transition:transform .16s, box-shadow .16s}
.card-hover:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--shadow)}

/* section heads */
.sec-head{display:flex; align-items:baseline; gap:12px; margin:2px 0 20px; flex-wrap:wrap}
.sec-head .fileno{font-family:var(--mono); font-size:11px; color:var(--rosso); letter-spacing:.2em;
  border:1.5px solid var(--rosso); padding:3px 7px; border-radius:3px}
.sec-head h2{font-family:var(--disp); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:clamp(20px,3vw,28px)}
.sec-head .rule{flex:1; height:2px; background:var(--line-strong); min-width:20px}
.sec-head .ar{font-family:var(--sans); color:var(--ink-soft); font-size:14px; direction:rtl}

/* badges / verdict stamps / chips */
.badge{font-family:var(--mono); font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:3px;
  border:1px solid; letter-spacing:.04em; white-space:nowrap; display:inline-block}
.b-crit{color:var(--rosso); border-color:var(--rosso); background:rgba(176,36,24,.08)}
.b-high{color:var(--amber); border-color:var(--amber); background:rgba(192,122,18,.08)}
.b-med{color:var(--steel); border-color:var(--steel); background:rgba(63,99,119,.08)}
.b-plan{color:var(--violet); border-color:var(--violet); background:rgba(107,74,143,.08)}
.b-done{color:var(--green); border-color:var(--green); background:rgba(74,109,47,.08)}
.b-ink{color:var(--ink-soft); border-color:var(--line-strong); background:transparent}

.vd{font-family:var(--mono); font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; border:1px solid; white-space:nowrap}
.vd.buy{color:var(--green); border-color:var(--green); background:rgba(74,109,47,.08)}
.vd.hold{color:var(--amber); border-color:var(--amber); background:rgba(192,122,18,.08)}
.vd.stop{color:var(--rosso); border-color:var(--rosso); background:rgba(176,36,24,.09)}
.vd.later{color:var(--violet); border-color:var(--violet); background:rgba(107,74,143,.08)}
.vd.installed{color:var(--steel); border-color:var(--steel); background:rgba(63,99,119,.08)}

/* buttons */
.btn{font-family:var(--disp); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:13px;
  background:var(--ink); color:var(--paper); border:1.5px solid var(--ink); border-radius:6px;
  padding:9px 15px; cursor:pointer; transition:transform .12s, filter .12s; display:inline-flex; align-items:center; gap:7px}
.btn:hover{transform:translateY(-1px); filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.ghost:hover{background:var(--card2)}
.btn.sm{font-size:11px; padding:6px 11px}
.btn.rosso{background:var(--rosso); border-color:var(--rosso)}

/* pill filters */
.filters{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.fbtn{font-family:var(--mono); font-size:11px; cursor:pointer; background:var(--card); color:var(--ink-soft);
  border:1.5px solid var(--line-strong); border-radius:4px; padding:7px 13px; transition:all .15s}
.fbtn:hover{border-color:var(--ink); color:var(--ink)}
.fbtn.active{background:var(--ink); border-color:var(--ink); color:var(--paper)}

/* tables */
.tbl-scroll{overflow-x:auto; border:1.5px solid var(--ink); border-radius:8px}
table.tbl{width:100%; border-collapse:collapse; background:var(--card)}
table.tbl th{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--paper);
  text-align:left; padding:9px 10px; background:var(--ink); white-space:nowrap; position:sticky; top:0; z-index:1}
table.tbl td{padding:9px 10px; border-bottom:1px solid var(--line); font-size:12px; vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:nth-child(even) td{background:rgba(150,140,110,.09)}
table.tbl tr.dim td{opacity:.5}

/* inputs */
.inp{font-family:var(--mono); font-size:12.5px; background:var(--paper); color:var(--ink);
  border:1.5px solid var(--line-strong); border-radius:4px; padding:7px 9px; width:100%}
.inp:focus{outline:none; border-color:var(--rosso); box-shadow:0 0 0 2px rgba(176,36,24,.14)}
.inp.num{text-align:right}
label.fld{display:block; margin-bottom:10px}
label.fld .lb{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:4px}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.tile{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r); padding:14px; box-shadow:3px 3px 0 var(--shadow)}
.tile .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}
.tile .v{font-family:var(--disp); font-weight:700; font-size:30px; letter-spacing:.02em; margin-top:4px; line-height:1}
.tile .v small{font-size:14px; color:var(--ink-soft)}
.tile .sub{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-top:5px}

/* meters */
.meter{height:12px; border:1.5px solid var(--ink); border-radius:3px; background:var(--paper); overflow:hidden}
.meter .fill{height:100%; width:0; transition:width 1.2s cubic-bezier(.3,1,.3,1)}
.f-red{background:repeating-linear-gradient(-45deg,var(--rosso-deep) 0 8px,var(--rosso) 8px 16px)}
.f-amber{background:repeating-linear-gradient(-45deg,#8a5709 0 8px,var(--amber) 8px 16px)}
.f-steel{background:repeating-linear-gradient(-45deg,#2c4756 0 8px,var(--steel) 8px 16px)}
.f-violet{background:repeating-linear-gradient(-45deg,#4d3568 0 8px,var(--violet) 8px 16px)}
.f-green{background:repeating-linear-gradient(-45deg,#33501f 0 8px,var(--green) 8px 16px)}

/* dial gauge */
.dial{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--r); padding:18px 14px 14px;
  text-align:center; box-shadow:4px 4px 0 var(--shadow)}
.dial svg{width:100%; max-width:184px}
.dial .lab{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin-top:4px}
.dial .val{font-family:var(--disp); font-weight:700; font-size:30px; margin-top:2px}
.dial .sub{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-top:5px; line-height:1.5}
.needle{transform-origin:100px 100px; transition:transform 1.4s cubic-bezier(.22,1.2,.34,1)}
.arc{transition:stroke-dashoffset 1.4s cubic-bezier(.3,1,.3,1)}

/* modal */
.modal-back{position:fixed; inset:0; background:rgba(20,16,12,.55); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:200; padding:18px}
.modal-back.open{display:flex; animation:fade .2s}
.modal{background:var(--card); border:2px solid var(--ink); border-radius:12px; max-width:560px; width:100%;
  max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .m-head{display:flex; justify-content:space-between; align-items:center; padding:14px 18px;
  border-bottom:2px solid var(--ink); position:sticky; top:0; background:var(--card)}
.modal .m-head h3{font-family:var(--disp); font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:18px}
.modal .m-body{padding:18px}
.x-btn{background:none; border:none; font-size:22px; cursor:pointer; color:var(--ink-soft); line-height:1}
.x-btn:hover{color:var(--rosso)}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip); position:absolute; bottom:125%; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:10px; padding:5px 8px; border-radius:4px;
  white-space:nowrap; z-index:50; pointer-events:none}

/* empty state */
.empty{border:1.5px dashed var(--line-strong); border-radius:var(--r); padding:26px; text-align:center;
  color:var(--ink-soft); font-family:var(--mono); font-size:12px}

/* toast */
#toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(30px);
  background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:12px; padding:10px 18px;
  border-radius:6px; z-index:300; opacity:0; transition:all .3s; pointer-events:none}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* datatable */
.dt-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.dt-search{max-width:220px}
.dt-filter{max-width:160px; width:auto}
.dt-spacer{flex:1; min-width:8px}
.dt-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:8px}
.dt-pager{display:flex; align-items:center; gap:8px}
.dt-pager .mono{font-size:12px}
.btn[disabled]{opacity:.4; cursor:not-allowed}

/* command center layout */
.cc-grid{display:grid; grid-template-columns:2fr 1fr; gap:var(--gap)}
@media (max-width:820px){.cc-grid{grid-template-columns:1fr}}
.alert-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line)}
.alert-row:last-child{border-bottom:none}
.alert-dot{width:9px; height:9px; border-radius:2px; margin-top:5px; flex:0 0 9px; transform:rotate(45deg)}
.alert-dot.crit{background:var(--rosso)} .alert-dot.warn{background:var(--amber)}
.alert-row .at{font-weight:700; font-size:13px} .alert-row .ad{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft)}
.qa{display:flex; flex-wrap:wrap; gap:8px}

/* notification bell */
.bell{position:relative}
.bell .dot{position:absolute; top:2px; right:2px; min-width:15px; height:15px; padding:0 3px; background:var(--rosso); color:#fff;
  font-family:var(--mono); font-size:9px; border-radius:8px; display:grid; place-items:center; line-height:1}
.notif-panel{position:absolute; top:44px; right:0; width:320px; max-width:82vw; background:var(--card); border:1.5px solid var(--ink);
  border-radius:8px; box-shadow:0 14px 40px rgba(0,0,0,.25); max-height:60vh; overflow:auto; display:none; z-index:60}
.notif-panel.open{display:block}

/* expandable */
.exp{border:1.5px solid var(--ink); border-radius:8px; background:var(--card); margin-bottom:10px; overflow:hidden}
.exp>summary{padding:12px 14px; cursor:pointer; font-family:var(--disp); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:14px; list-style:none; display:flex; justify-content:space-between; align-items:center}
.exp>summary::-webkit-details-marker{display:none}
.exp>summary::after{content:'+'; font-family:var(--mono); color:var(--rosso)}
.exp[open]>summary::after{content:'−'}
.exp .exp-body{padding:0 14px 14px; border-top:1px solid var(--line)}

/* misc */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-family:var(--mono); font-size:9.5px; background:var(--card2); border:1px solid var(--line-strong); border-radius:10px; padding:2px 8px; color:var(--ink-soft)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px}
.kv .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}

/* staggered reveal */
.stagger>*{opacity:0; transform:translateY(12px); animation:rise .5s forwards}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.11s}.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.19s}.stagger>*:nth-child(6){animation-delay:.23s}
.stagger>*:nth-child(7){animation-delay:.27s}.stagger>*:nth-child(8){animation-delay:.31s}
.stagger>*:nth-child(n+9){animation-delay:.34s}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

</style>
<style>
/* ==== css/layout.css ==== */
/* ============================================================
   LAYOUT — app shell, sidebar, topbar, responsive, print
   ============================================================ */
.app{display:grid; grid-template-columns:250px 1fr; min-height:100vh; position:relative; z-index:1}

/* sidebar */
.side{border-right:3px solid var(--ink); background:var(--card); position:sticky; top:0; height:100vh;
  overflow-y:auto; padding:0 0 20px}
.brand{padding:18px 16px 14px; border-bottom:3px solid var(--ink)}
.brand .dno{font-family:var(--mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--rosso)}
.brand h1{font-family:var(--disp); font-weight:700; text-transform:uppercase; font-size:26px; line-height:.9; margin-top:6px; letter-spacing:.01em}
.brand h1 em{font-style:normal; color:var(--rosso)}
.brand .veh{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-top:6px}
.veh-switch{margin:12px 16px 0; width:calc(100% - 32px)}

.nav-group{margin-top:14px}
.nav-group .gt{font-family:var(--mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); padding:0 16px 6px}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 16px; cursor:pointer; font-size:13.5px;
  border-left:3px solid transparent; transition:background .12s, border-color .12s; color:var(--ink)}
.nav-item:hover{background:var(--card2)}
.nav-item.active{background:var(--card2); border-left-color:var(--rosso); font-weight:700}
.nav-item .ic{width:18px; text-align:center; font-size:15px}
.nav-item .soon{margin-left:auto; font-family:var(--mono); font-size:8px; color:var(--ink-soft); border:1px solid var(--line-strong); padding:1px 4px; border-radius:3px}

/* main */
.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:12px 22px;
  background:var(--paper); border-bottom:3px solid var(--ink)}
.topbar .crumb{font-family:var(--mono); font-size:11px; color:var(--ink-soft); letter-spacing:.08em; text-transform:uppercase}
.topbar .crumb b{color:var(--ink)}
.topbar .spacer{flex:1}
.search-box{position:relative}
.search-box input{width:210px; max-width:38vw}
.icon-btn{background:var(--card); border:1.5px solid var(--line-strong); border-radius:6px; width:36px; height:36px;
  cursor:pointer; font-size:15px; display:grid; place-items:center; color:var(--ink)}
.icon-btn:hover{border-color:var(--ink)}
.view{padding:24px 22px 70px; max-width:1180px; width:100%; animation:rise .4s}

.hamb{display:none}

/* search results dropdown */
.search-results{position:absolute; top:44px; right:0; width:340px; max-width:80vw; background:var(--card);
  border:1.5px solid var(--ink); border-radius:8px; box-shadow:0 14px 40px rgba(0,0,0,.25); max-height:60vh; overflow:auto; display:none; z-index:60}
.search-results.open{display:block}
.sr-item{padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:12.5px}
.sr-item:hover{background:var(--card2)}
.sr-item .t{font-weight:700}
.sr-item .m{font-family:var(--mono); font-size:10px; color:var(--ink-soft)}

/* grids */
.grid-2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:var(--gap)}
.grid-3{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--gap)}

/* responsive */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed; left:0; top:0; z-index:120; width:264px; transform:translateX(-100%); transition:transform .25s; box-shadow:6px 0 30px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .hamb{display:grid}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:110; display:none}
  .backdrop.open{display:block}
  .view{padding:18px 15px 60px}
  .search-box input{width:150px}
}
@media (max-width:560px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .topbar .crumb{display:none}
}

/* print */
@media print{
  .side,.topbar,.hamb,.no-print{display:none !important}
  .app{grid-template-columns:1fr}
  body{background:#fff; color:#000}
  .card,.tile,.dial{box-shadow:none; border-color:#000}
  .view{padding:0; max-width:100%}
}

</style>

</head>

<script>
/* ==== js/core/util.js ==== */
/* ============================================================
   App.util — DOM + formatting helpers (namespaced, no ES imports
   so the bundle works over file:// offline)
   ============================================================ */
window.App = window.App || {};
App.util = (function () {
  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'data') for (const d in attrs[k]) n.dataset[d] = attrs[k][d];
      else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

  const EGP = n => 'EGP ' + Math.round(+n || 0).toLocaleString('en-US');
  const num = n => (+n || 0).toLocaleString('en-US');
  function shortDate(d) { if (!d) return '—'; const t = new Date(d); return isNaN(t) ? d : t.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }

  function countUp(node, to, opts) {
    opts = opts || {}; const dur = opts.dur || 1100, dec = opts.dec || 0, pre = opts.pre || '', suf = opts.suf || '';
    let t0 = null;
    function step(ts) { if (!t0) t0 = ts; const p = Math.min((ts - t0) / dur, 1); const e = 1 - Math.pow(1 - p, 3);
      node.textContent = pre + (to * e).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
      if (p < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  function toast(msg) {
    let t = $('#toast'); if (!t) { t = el('div', { id: 'toast' }); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function modal(title, bodyNode) {
    let back = $('#modalBack');
    if (!back) { back = el('div', { id: 'modalBack', class: 'modal-back' }); document.body.appendChild(back); }
    back.innerHTML = '';
    const close = () => back.classList.remove('open');
    const box = el('div', { class: 'modal' }, [
      el('div', { class: 'm-head' }, [el('h3', { text: title }), el('button', { class: 'x-btn', 'aria-label': 'Close', onclick: close }, '×')]),
      el('div', { class: 'm-body' }, [bodyNode])
    ]);
    back.appendChild(box);
    back.onclick = e => { if (e.target === back) close(); };
    back.classList.add('open');
    return { close };
  }

  function gaugeSVG(pct, color) {
    color = color || 'var(--amber)';
    const deg = -90 + (pct / 100) * 180, off = 251 - (pct / 100) * 251;
    return `<svg viewBox="0 0 200 120" role="img" aria-label="${pct} percent">
      <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
      <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="${off}" class="arc"/>
      <line x1="100" y1="100" x2="100" y2="36" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" class="needle" style="transform:rotate(${deg}deg)"/>
      <circle cx="100" cy="100" r="7" fill="var(--rosso)"/></svg>`;
  }

  return { el, $, $$, EGP, num, shortDate, countUp, toast, modal, gaugeSVG };
})();

/* ============================================================
   App.config — central configuration (theme, units, currency,
   language, icons, feature flags, notification rules).
   Everything configurable lives here; modules read from it,
   never hardcode. Persisted user overrides in localStorage.
   ============================================================ */
window.App = window.App || {};
App.config = (function () {
  const KEY = 'gp-os-config';
  const DEFAULTS = {
    version: '2.0',
    locale: { language: 'en', rtlSupport: true },
    units: { distance: 'km', volume: 'L', consumption: 'L/100km' },
    currency: { code: 'EGP', symbol: 'EGP', locale: 'en-US' },

      command: '⌂', restoration: '🔧', parts: '⚙', diagnostics: '⚠', service: '📘', fuel: '⛽',

      settings: '⚙️', notifications: '🔔'
    },

    reminders: {
      oilChangeKm: 10000, oilChangeMonths: 12,
      serviceDueKmWindow: 3000, serviceDueDaysWindow: 30,
      warrantyWarnDays: 30, insuranceWarnDays: 30, licenseWarnDays: 45,
      timingBeltKm: 70000, timingBeltYears: 4
    },
    /* feature flags — future modules become active by flipping to true */
    features: {
      obdLive: false, aiAdvisor: false, expenseForecast: false, vinDecoder: false,
      ocrInvoice: false, barcodeScanner: false, cloudSync: false, multiUser: false
    },
    backup: { autoKeep: 5 },
    /* cloud sync (Supabase) — filled in Settings; anon key is public by
       design, so keep the hosted site behind Cloudflare Access */
    cloud: { provider: 'supabase', url: '', anonKey: '', table: 'garage_state', rowId: 'gp-tjet-2010' }
  };

  let cfg = null;
  function load() {
    try { cfg = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch (e) { cfg = Object.assign({}, DEFAULTS); }
    // deep-merge nested defaults so new keys appear after upgrades
    ['locale', 'units', 'currency', 'theme', 'icons', 'reminders', 'features', 'backup', 'cloud'].forEach(k =>
      cfg[k] = Object.assign({}, DEFAULTS[k], cfg[k] || {}));
    return cfg;
  }
  function get() { return cfg || load(); }
  function set(patch) { cfg = Object.assign(get(), patch); localStorage.setItem(KEY, JSON.stringify(cfg)); }
  function setPath(section, key, val) { const c = get(); c[section] = c[section] || {}; c[section][key] = val; localStorage.setItem(KEY, JSON.stringify(c)); }
  function reset() { localStorage.removeItem(KEY); cfg = null; return load(); }
  function icon(id) { return get().icons[id] || '•'; }
  function money(n) { const c = get().currency; return c.symbol + ' ' + Math.round(+n || 0).toLocaleString(c.locale); }

  return { DEFAULTS, load, get, set, setPath, reset, icon, money };
})();

</script>

<script>
/* ==== js/core/store.js ==== */
/* ============================================================
   App.store — the data layer.
   - Vehicle-scoped collections (array of records = future DB rows).
   - Pluggable persistence ADAPTER so we can swap localStorage for
     SQLite / Supabase / Postgres later WITHOUT touching the UI.
     Any adapter must implement: load() -> state|null, save(state).
   - Pub/sub so modules re-render on change.
   ============================================================ */
window.App = window.App || {};
App.store = (function () {
  const KEY = 'gp-os-v2';

  /* ---- persistence adapters (swap here for a real DB) ---- */
  const adapters = {
    local: {
      load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
      save(state) { localStorage.setItem(KEY, JSON.stringify(state)); }
    }
    /* Example future adapter (same signature, async-capable):
       supabase: { async load(){...}, async save(s){...} }
       Only this object changes; modules keep calling App.store.* */
  };
  let adapter = adapters.local;

  let state = null;
  const subs = [];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function migrate(s) {
    // simple forward-migration hook; bump seed.meta.schema when shape changes
    if (!s || !s.meta || s.meta.schema !== App.seed.meta.schema) return clone(App.seed);
    return s;
  }

  function load() {
    state = migrate(adapter.load());
    return state;
  }
  function persist() {
    state.meta.savedAt = new Date().toISOString();
    adapter.save(state);
    subs.forEach(fn => fn(state));
  }
  function subscribe(fn) { subs.push(fn); return () => { const i = subs.indexOf(fn); if (i > -1) subs.splice(i, 1); }; }

  /* ---- vehicle scope ---- */
  function vehicles() { return state.vehicles; }
  function activeVehicle() { return state.vehicles.find(v => v.id === state.activeVehicleId) || state.vehicles[0]; }
  function setActiveVehicle(id) { state.activeVehicleId = id; persist(); }
  function addVehicle(v) {
    v.id = v.id || 'veh-' + Date.now();
    v.data = v.data || emptyData();
    state.vehicles.push(v); state.activeVehicleId = v.id; persist(); return v;
  }
  function emptyData() {
    return { parts: [], installed: [], faults: [], scans: [], service: [], fuel: [], budget: [],
      planner: [], workshops: [], suppliers: [], inventory: [], documents: [], roadmap: [], photos: [],
      value: { purchase: 0, invested: 0, repairEstimate: 0, modEstimate: 0, estResale: 0 } };
  }

  /* ---- record normalization: every record gets id + audit fields ---- */
  function normalize(coll, rec) {
    const now = new Date().toISOString();
    rec.id = rec.id || coll + '-' + Date.now() + '-' + Math.floor(Math.random() * 1e4);
    if (!rec.createdAt) rec.createdAt = now;
    rec.updatedAt = now;
    if (rec.notes == null) rec.notes = rec.notes || '';
    if (!Array.isArray(rec.tags)) rec.tags = rec.tags || [];
    if (!Array.isArray(rec.attachments)) rec.attachments = rec.attachments || [];
    return rec;
  }

  /* ---- generic collection CRUD (vehicle-scoped) ---- */
  function all(coll) { const v = activeVehicle(); return (v.data[coll] = v.data[coll] || []); }
  function add(coll, rec) { normalize(coll, rec); all(coll).unshift(rec); persist(); return rec; }
  function update(coll, id, patch) { const r = all(coll).find(x => x.id === id); if (r) { Object.assign(r, patch); r.updatedAt = new Date().toISOString(); persist(); } return r; }
  function remove(coll, id) { const a = all(coll); const i = a.findIndex(x => x.id === id); if (i > -1) { a.splice(i, 1); persist(); } }

  /* ---- automatic backup / restore (rolling snapshots) ---- */
  const BKEY = 'gp-os-backups';
  function backups() { try { return JSON.parse(localStorage.getItem(BKEY)) || []; } catch (e) { return []; } }
  function snapshot(label) {
    const keep = (App.config && App.config.get().backup.autoKeep) || 5;
    const list = backups();
    list.unshift({ at: new Date().toISOString(), label: label || 'auto', json: JSON.stringify(state) });
    localStorage.setItem(BKEY, JSON.stringify(list.slice(0, keep)));
  }
  function restoreBackup(at) { const b = backups().find(x => x.at === at); if (b) { state = migrate(JSON.parse(b.json)); persist(); } }

  /* ---- vehicle fields ---- */
  function veh() { return activeVehicle(); }
  function setVeh(patch) { Object.assign(activeVehicle(), patch); persist(); }

  /* adopt remote state (from cloud sync) into local cache + UI,
     WITHOUT bumping savedAt (preserves the remote timestamp so we
     don't treat the pulled copy as "newer" and echo it back). */
  function adopt(data) { state = migrate(data); adapter.save(state); subs.forEach(fn => fn(state)); }

  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(txt) { const parsed = JSON.parse(txt); state = migrate(parsed); persist(); }
  function reset() { state = clone(App.seed); persist(); }

  /* ---- global search across collections ---- */
  function search(q) {
    q = (q || '').trim().toLowerCase(); if (!q) return [];
    const out = []; const v = activeVehicle();
    const map = { parts: ['name', 'ar', 'oem', 'fiat', 'alt', 'brand', 'category', 'notes'],
      faults: ['code', 'system', 'desc', 'symptom', 'root'], service: ['work', 'workshop', 'parts', 'date'],
      workshops: ['name', 'spec', 'phone'], suppliers: ['name', 'contact'], inventory: ['item', 'category'],
      documents: ['name', 'type', 'ref'] };
    Object.keys(map).forEach(coll => (v.data[coll] || []).forEach(rec => {
      if (map[coll].some(f => (rec[f] || '').toString().toLowerCase().includes(q)))
        out.push({ coll, rec, label: rec.name || rec.code || rec.work || rec.item || rec.title || '—' });
    }));
    return out.slice(0, 24);
  }

  return { load, persist, subscribe, state: () => state, vehicles, activeVehicle, setActiveVehicle, addVehicle,
    all, add, update, remove, veh, setVeh, adopt, exportJSON, importJSON, reset, search,
    backups, snapshot, restoreBackup, useAdapter: a => { adapter = adapters[a] || adapter; } };
})();

</script>
<script>
/* ==== js/core/ui.js ==== */
/* ============================================================
   App.ui — reusable component builders shared by all modules
   ============================================================ */
window.App = window.App || {};
App.ui = (function () {
  const { el, EGP, num } = App.util;

  function secHead(fileno, title, ar) {
    return el('div', { class: 'sec-head' }, [
      fileno ? el('span', { class: 'fileno', text: fileno }) : null,
      el('h2', { text: title }),
      el('div', { class: 'rule' }),

    ]);
  }

  function tile(k, v, sub, opts) {
    opts = opts || {};
    const vNode = el('div', { class: 'v' });
    const t = el('div', { class: 'tile' }, [
      el('div', { class: 'k', text: k }), vNode, sub ? el('div', { class: 'sub', text: sub }) : null
    ]);
    if (opts.count != null) App.util.countUp(vNode, opts.count, opts);
    else vNode.innerHTML = v;
    if (opts.color) vNode.style.color = opts.color;

  function dial(pct, label, sub, color) {

      `<div class="lab">${label}</div>` + (sub ? `<div class="sub">${sub}</div>` : '');
    // animate after mount
    setTimeout(() => {
      const deg = -90 + (pct / 100) * 180, off = 251 - (pct / 100) * 251;

      if (n) n.style.transform = 'rotate(' + deg + 'deg)';
      if (a) a.style.strokeDashoffset = off;
    }, 60);
    return d;
  }

  function meter(pct, cls) {
    const m = el('div', { class: 'meter' }); const f = el('div', { class: 'fill ' + (cls || 'f-amber') });
    m.appendChild(f); setTimeout(() => f.style.width = Math.min(100, pct) + '%', 60); return m;
  }

  function badge(text, cls) { return el('span', { class: 'badge ' + (cls || 'b-ink'), text }); }
  function verdict(v) {
    const map = { buy: ['buy', '✓ BUY'], hold: ['hold', '⏸ HOLD'], stop: ['stop', '✕ STOP'], later: ['later', '◷ LATER'], installed: ['installed', '● IN'] };
    const m = map[v] || map.buy; return el('span', { class: 'vd ' + m[0], text: m[1] });
  }

  function table(cols, rows) {

    const tb = el('tbody');
    rows.forEach(r => tb.appendChild(el('tr', { class: r._cls || '' }, r.cells.map(c =>
      el('td', typeof c === 'object' && c.nodeType ? {} : {}, [typeof c === 'object' && c && c.nodeType ? c : document.createTextNode(c == null ? '—' : c)])))));
    t.appendChild(thead); t.appendChild(tb); wrap.appendChild(t); return wrap;
  }

  function empty(msg) { return el('div', { class: 'empty', text: msg || 'No records yet.' }); }

  function priorityBadge(p) {
    const m = { critical: 'b-crit', high: 'b-high', medium: 'b-med', low: 'b-med', cosmetic: 'b-plan' };
    return badge((p || 'medium').toUpperCase(), m[p] || 'b-med');
  }

  return { secHead, tile, dial, meter, badge, verdict, table, empty, priorityBadge };
})();

<script>
/* ==== js/core/datatable.js ==== */
/* ============================================================
   App.DataTable — reusable production table:
   search · column sort · filters · pagination · CSV export.
   Config-driven; used by Parts, Service, Fuel, Inventory, etc.
     cols:  [{key,label,render?(row)->node|string, sort?:true, filter?:[values]}]
     rows:  array of records
     opts:  {pageSize, searchKeys, title, onRow(row), actions:[{label,fn}]}
   ============================================================ */
window.App = window.App || {};
App.DataTable = function (cols, rows, opts) {
  const { el } = App.util;
  opts = opts || {};
  const pageSize = opts.pageSize || 12;
  let q = '', sortKey = null, sortDir = 1, page = 1;
  const filters = {};

  const root = el('div', { class: 'dt' });
  const bar = el('div', { class: 'dt-bar' });
  const body = el('div');
  root.appendChild(bar); root.appendChild(body);

  function filtered() {
    let data = rows.slice();
    if (q) {
      const keys = opts.searchKeys || cols.map(c => c.key);
      const s = q.toLowerCase();
      data = data.filter(r => keys.some(k => (r[k] == null ? '' : String(r[k])).toLowerCase().includes(s)));
    }
    Object.keys(filters).forEach(k => { if (filters[k]) data = data.filter(r => String(r[k]) === filters[k]); });
    if (sortKey) data.sort((a, b) => {
      let x = a[sortKey], y = b[sortKey];
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * sortDir;
      return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y)) * sortDir;
    });
    return data;
  }

  function exportCSV() {
    const data = filtered();
    const head = cols.map(c => '"' + c.label + '"').join(',');
    const lines = data.map(r => cols.map(c => '"' + String(r[c.key] == null ? '' : r[c.key]).replace(/"/g, '""') + '"').join(','));
    const csv = [head].concat(lines).join('\n');
    const a = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv), download: (opts.title || 'export') + '.csv' });
    document.body.appendChild(a); a.click(); a.remove();
    App.util.toast('CSV exported (' + data.length + ' rows)');
  }

  function renderBar() {
    bar.innerHTML = '';
    const search = el('input', { class: 'inp dt-search', type: 'search', placeholder: 'Search…', value: q,
      oninput: e => { q = e.target.value; page = 1; render(); } });
    bar.appendChild(search);
    cols.filter(c => c.filter).forEach(c => {
      const sel = el('select', { class: 'inp dt-filter', onchange: e => { filters[c.key] = e.target.value; page = 1; render(); } });
      sel.appendChild(el('option', { value: '', text: c.label + ': all' }));
      c.filter.forEach(v => sel.appendChild(el('option', { value: v, text: v, selected: filters[c.key] === v ? 'selected' : null })));
      bar.appendChild(sel);
    });
    const spacer = el('div', { class: 'dt-spacer' }); bar.appendChild(spacer);
    (opts.actions || []).forEach(a => bar.appendChild(el('button', { class: 'btn sm ' + (a.cls || 'ghost'), onclick: a.fn }, a.label)));
    bar.appendChild(el('button', { class: 'btn sm ghost', onclick: exportCSV, 'data-tip': 'Export CSV' }, '⇩ CSV'));
  }

  function render() {
    renderBar();
    const data = filtered();
    const pages = Math.max(1, Math.ceil(data.length / pageSize));
    if (page > pages) page = pages;
    const slice = data.slice((page - 1) * pageSize, page * pageSize);

    const wrap = el('div', { class: 'tbl-scroll' });
    const t = el('table', { class: 'tbl' });
    const thead = el('thead', {}, [el('tr', {}, cols.map(c => {
      const arrow = sortKey === c.key ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
      return el('th', { style: c.sort ? 'cursor:pointer' : '', onclick: c.sort ? () => { if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = 1; } render(); } : null }, (c.label + arrow));
    }))]);
    const tb = el('tbody');
    if (!slice.length) tb.appendChild(el('tr', {}, [el('td', { colspan: cols.length }, [App.ui.empty('No matching records.')])]));
    slice.forEach(r => {
      const tr = el('tr', { class: r._dim ? 'dim' : '', style: opts.onRow ? 'cursor:pointer' : '', onclick: opts.onRow ? () => opts.onRow(r) : null },
        cols.map(c => {
          const v = c.render ? c.render(r) : (r[c.key] == null ? '—' : r[c.key]);
          return el('td', {}, [typeof v === 'object' && v && v.nodeType ? v : document.createTextNode(String(v))]);
        }));
      tb.appendChild(tr);
    });
    t.appendChild(thead); t.appendChild(tb); wrap.appendChild(t);

    const foot = el('div', { class: 'dt-foot' }, [
      el('span', { class: 'mono muted', text: data.length + ' record' + (data.length === 1 ? '' : 's') }),
      el('div', { class: 'dt-pager' }, [
        el('button', { class: 'btn sm ghost', disabled: page <= 1 ? 'disabled' : null, onclick: () => { page--; render(); } }, '‹'),
        el('span', { class: 'mono', text: page + ' / ' + pages }),
        el('button', { class: 'btn sm ghost', disabled: page >= pages ? 'disabled' : null, onclick: () => { page++; render(); } }, '›')
      ])
    ]);

    body.innerHTML = ''; body.appendChild(wrap); body.appendChild(foot);
  }

  render();
  return root;
};

</script>
<script>
/* ==== js/core/crud.js ==== */
/* ============================================================
   App.crud — factory that turns a field schema into a full
   module (DataTable + add/edit/delete modal). Removes duplication
   across the simpler collection modules. Records auto-get
   id/createdAt/updatedAt/notes/tags/attachments from the store.
     spec: { id,label,group,icon,coll,fileno,ar,
             cols:[{key,label,sort,filter,render}],
             fields:[{key,label,type:'text|number|date|select|textarea',options?}],
             searchKeys:[], title }
   ============================================================ */
window.App = window.App || {};
App.crud = function (spec) {
  const { el } = App.util; const ui = App.ui;
  App.router.register({
    id: spec.id, label: spec.label, group: spec.group, icon: spec.icon, soon: spec.soon,
    render(view) {
      const rows = App.store.all(spec.coll);
      view.appendChild(ui.secHead(spec.fileno || '', spec.label, spec.ar || ''));
      if (spec.intro) { const c = el('div', { class: 'card', style: 'margin-bottom:16px' }, [el('div', { class: 'pad', html: spec.intro })]); view.appendChild(c); }
      const cols = spec.cols.slice();
      const dt = App.DataTable(cols, rows, {
        title: spec.title || spec.coll, pageSize: spec.pageSize || 12,
        searchKeys: spec.searchKeys || spec.fields.map(f => f.key),
        onRow: r => openForm(r),
        actions: [{ label: '+ Add', cls: 'rosso', fn: () => openForm(null) }].concat(spec.actions || [])
      });
      view.appendChild(dt);
    }
  });

  function openForm(rec) {
    const isNew = !rec; rec = rec || {};
    const { el } = App.util;
    const body = el('div');
    spec.fields.forEach(fl => {
      let input;
      if (fl.type === 'select') input = App._selectFrom(fl.key, fl.options, rec[fl.key]);
      else if (fl.type === 'textarea') input = el('textarea', { class: 'inp', rows: '2', data: { key: fl.key } }, rec[fl.key] || '');
      else input = el('input', { class: 'inp', type: fl.type || 'text', value: rec[fl.key] == null ? '' : rec[fl.key], data: { key: fl.key } });
      body.appendChild(el('label', { class: 'fld' }, [el('span', { class: 'lb', text: fl.label }), input]));
    });
    body.appendChild(el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'Tags (comma)' }), el('input', { class: 'inp', value: (rec.tags || []).join(', '), data: { key: 'tags' } })]));
    body.appendChild(el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'Notes' }), el('textarea', { class: 'inp', rows: '2', data: { key: 'notes' } }, rec.notes || '')]));
    body.appendChild(el('div', { style: 'display:flex;gap:8px;margin-top:8px' }, [
      el('button', { class: 'btn rosso', onclick: save }, isNew ? 'Add' : 'Save'),
      isNew ? null : el('button', { class: 'btn ghost', onclick: () => { App.store.remove(spec.coll, rec.id); m.close(); App.router.go(spec.id, true); App.util.toast('Deleted'); } }, 'Delete')
    ]));
    const m = App.util.modal(isNew ? 'New ' + spec.label : (rec[spec.fields[0].key] || 'Edit'), body);
    function save() {
      const patch = {};
      body.querySelectorAll('[data-key]').forEach(i => {
        let val = i.value;
        const fl = spec.fields.find(f => f.key === i.dataset.key);
        if (i.dataset.key === 'tags') val = val.split(',').map(s => s.trim()).filter(Boolean);
        else if (fl && fl.type === 'number') val = val === '' ? null : +val;
        patch[i.dataset.key] = val;
      });
      if (isNew) App.store.add(spec.coll, patch); else App.store.update(spec.coll, rec.id, patch);
      m.close(); App.router.go(spec.id, true); App.util.toast('Saved');
    }
  }
};

</script>
<script>
/* ==== js/core/notify.js ==== */
/* ============================================================
   App.notify — notification engine.
   Evaluates data-driven rules (config.reminders) against the
   active vehicle and returns a list of alerts. Pure/derived:
   no state of its own, so it stays correct as data changes.
   Rule kinds: maintenance · warranty · insurance · license ·
   oil · mileage · critical-fault.
   ============================================================ */
window.App = window.App || {};
App.notify = (function () {
  function daysUntil(d) { if (!d) return null; return Math.round((new Date(d) - Date.now()) / 86400000); }

  function evaluate() {
    const v = App.store.veh(); const r = App.config.get().reminders; const out = [];
    const km = v.mileage || 0;

    // upcoming maintenance (planner)
    (v.data.planner || []).forEach(p => {
      if (p.done) return;
      const dk = p.dueKm != null ? p.dueKm - km : null;
      const dd = daysUntil(p.dueDate);
      if ((dk != null && dk <= r.serviceDueKmWindow) || (dd != null && dd <= r.serviceDueDaysWindow)) {
        out.push({ kind: p.kind === 'critical' ? 'critical' : 'maintenance', sev: dk != null && dk <= 0 ? 'crit' : 'warn',
          title: p.title, detail: (dk != null ? (dk <= 0 ? 'Overdue by ' + Math.abs(dk) + ' km' : 'in ' + dk + ' km') : '') + (dd != null ? (dk != null ? ' · ' : '') + (dd <= 0 ? 'past due' : 'in ' + dd + ' days') : '') });
      }
    });

    // open critical faults
    (v.data.faults || []).filter(f => !f.solved && f.priority === 'critical').forEach(f =>
      out.push({ kind: 'fault', sev: 'crit', title: 'Fault ' + f.code + ' — ' + f.system, detail: f.desc }));

    // warranty expiries on parts / service
    (v.data.parts || []).forEach(p => { const d = daysUntil(p.warrantyExpiry); if (d != null && d <= r.warrantyWarnDays)
      out.push({ kind: 'warranty', sev: d <= 0 ? 'crit' : 'warn', title: 'Warranty: ' + p.name, detail: d <= 0 ? 'expired' : 'in ' + d + ' days' }); });

    // vehicle documents: insurance / license
    const ins = daysUntil(v.insuranceExpiry); if (ins != null && ins <= r.insuranceWarnDays)
      out.push({ kind: 'insurance', sev: ins <= 0 ? 'crit' : 'warn', title: 'Insurance', detail: ins <= 0 ? 'expired' : 'in ' + ins + ' days' });
    const lic = daysUntil(v.licenseExpiry); if (lic != null && lic <= r.licenseWarnDays)
      out.push({ kind: 'license', sev: lic <= 0 ? 'crit' : 'warn', title: 'License renewal', detail: lic <= 0 ? 'overdue' : 'in ' + lic + ' days' });

    // oil reminder (last service of type oil)
    const oil = (v.data.service || []).filter(s => /oil/i.test(s.work)).sort((a, b) => (b.km || 0) - (a.km || 0))[0];
    if (oil) { const since = km - (oil.km || 0); if (since >= r.oilChangeKm - 1500)
      out.push({ kind: 'oil', sev: since >= r.oilChangeKm ? 'crit' : 'warn', title: 'Engine oil', detail: since + ' km since last change' }); }

    return out;
  }

  function count() { return evaluate().length; }
  return { evaluate, count, daysUntil };
})();

</script>
<script>
/* ==== js/core/sync.js ==== */
/* ============================================================
   App.sync — Supabase cloud sync (localStorage-first, background).
   - Pure REST via fetch(); no external library, so the offline
     build stays dependency-free and degrades gracefully offline.
   - Whole app state is stored as one JSONB row (id,data,updated_at).
     Trivial to normalize into per-collection tables later.
   - Config (url, anon key, table, rowId) comes from App.config.cloud
     and the `cloudSync` feature flag — never hardcoded.
   Security: the anon key is PUBLIC by design; keep the hosted site
   behind Cloudflare Access + enable RLS on the table (see HOSTING.md).
   ============================================================ */
window.App = window.App || {};
App.sync = (function () {
  let enabled = false, timer = null, busy = false;

  function conf() { return App.config.get().cloud || {}; }
  function ready() { const c = conf(); return !!(c.url && c.anonKey); }
  function base() { return conf().url.replace(/\/+$/, '') + '/rest/v1/'; }
  function headers(extra) {
    const c = conf();
    return Object.assign({ apikey: c.anonKey, Authorization: 'Bearer ' + c.anonKey, 'Content-Type': 'application/json' }, extra || {});
  }

  async function pull() {
    if (!ready()) return { ok: false, reason: 'not configured' };
    const c = conf();
    const url = base() + encodeURIComponent(c.table) + '?id=eq.' + encodeURIComponent(c.rowId) + '&select=data,updated_at';
    const r = await fetch(url, { headers: headers() });
    if (!r.ok) return { ok: false, reason: 'HTTP ' + r.status };
    const rows = await r.json();
    if (!rows.length) return { ok: true, empty: true };
    return { ok: true, data: rows[0].data, updatedAt: rows[0].updated_at };
  }

  async function push(state) {
    if (!ready()) return { ok: false, reason: 'not configured' };
    const c = conf();
    const url = base() + encodeURIComponent(c.table) + '?on_conflict=id';
    const body = [{ id: c.rowId, data: state || App.store.state(), updated_at: new Date().toISOString() }];
    const r = await fetch(url, { method: 'POST', headers: headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(body) });
    return { ok: r.ok, reason: r.ok ? '' : 'HTTP ' + r.status };
  }

  function schedulePush() {
    if (!enabled) return;
    clearTimeout(timer);
    timer = setTimeout(async () => { try { await push(); } catch (e) { /* offline: keep local */ } }, 1500);
  }

  async function init() {
    enabled = ready() && !!App.config.get().features.cloudSync;
    if (!enabled) return;
    try {
      const res = await pull();
      if (res.ok && res.data) {
        const localAt = new Date((App.store.state().meta || {}).savedAt || 0).getTime();
        const remoteAt = new Date(res.updatedAt || 0).getTime();
        if (remoteAt > localAt) {
          App.store.adopt(res.data);
          App.util.toast('Synced from cloud ↓');
          if (App.router) App.router.go((location.hash || '').replace('#/', '') || 'command', true);
        } else {
          schedulePush(); // local is newer → upload
        }
      } else if (res.ok && res.empty) {
        schedulePush(); // first upload
      }
    } catch (e) { /* offline: silently stay on localStorage */ }
    App.store.subscribe(() => schedulePush());
  }

  async function test() { try { return await pull(); } catch (e) { return { ok: false, reason: e.message || 'network' }; } }
  function status() { return { enabled, ready: ready() }; }

  return { init, pull, push, test, status, schedulePush };
})();

</script>
<script>
/* ==== js/core/router.js ==== */
/* ============================================================
   App.router — module registry + hash routing + app shell
   Modules register with App.router.register({...}) and are
   rendered lazily into the view on navigation.
   ============================================================ */
window.App = window.App || {};
App.router = (function () {
  const { el, $ } = App.util;
  const modules = [];
  let current = null;

  function register(mod) { modules.push(mod); } // {id,label,icon,group,soon,render(el)}
  function get(id) { return modules.find(m => m.id === id); }

  const GROUPS = ['Overview', 'Vehicle', 'Money', 'Logistics', 'Archive', 'Insights'];

  function buildShell() {
    const v = App.store.veh();
    const app = el('div', { class: 'app' });

    /* sidebar */
    const side = el('aside', { class: 'side', id: 'side' });
    const brand = el('div', { class: 'brand' }, [
      el('div', { class: 'dno', text: '№ GP-2010-TJET · DOSSIER' }),
      el('h1', { html: 'GRANDE PUNTO <em>T-JET</em>' }),
      el('div', { class: 'veh', id: 'brandVeh', text: v.year + ' · ' + v.engine.split('(')[0].trim() })
    ]);
    side.appendChild(brand);

    // vehicle switcher (multi-vehicle ready)
    const sel = el('select', { class: 'inp veh-switch', id: 'vehSwitch', onchange: e => { App.store.setActiveVehicle(e.target.value); location.hash = '#/command'; go('command', true); } });
    App.store.vehicles().forEach(x => sel.appendChild(el('option', { value: x.id, text: x.make + ' ' + x.model + ' ' + x.year })));
    sel.value = App.store.state().activeVehicleId;
    side.appendChild(sel);

    GROUPS.forEach(g => {
      const items = modules.filter(m => m.group === g);
      if (!items.length) return;
      const grp = el('div', { class: 'nav-group' }, [el('div', { class: 'gt', text: g })]);
      items.forEach(m => grp.appendChild(el('div', {
        class: 'nav-item', data: { id: m.id }, role: 'button', tabindex: '0',
        onclick: () => go(m.id), onkeydown: e => { if (e.key === 'Enter') go(m.id); }
      }, [el('span', { class: 'ic', text: m.icon || '•' }), el('span', { text: m.label }),
        m.soon ? el('span', { class: 'soon', text: 'BETA' }) : null])));
      side.appendChild(grp);
    });

    /* main */
    const main = el('div', { class: 'main' });
    const topbar = el('div', { class: 'topbar' }, [
      el('button', { class: 'icon-btn hamb', 'aria-label': 'Menu', onclick: toggleSide }, '≡'),
      el('div', { class: 'crumb', id: 'crumb', html: 'GARAGE OS · <b>Command</b>' }),
      el('div', { class: 'spacer' }),
      searchBox(),
      el('button', { class: 'icon-btn', 'aria-label': 'Theme', 'data-tip': 'Light / Dark', onclick: toggleTheme }, '◐'),
      el('button', { class: 'icon-btn no-print', 'aria-label': 'Print', 'data-tip': 'Print', onclick: () => window.print() }, '⎙')
    ]);
    const view = el('main', { class: 'view', id: 'view' });
    main.appendChild(topbar); main.appendChild(view);

    const backdrop = el('div', { class: 'backdrop', id: 'backdrop', onclick: toggleSide });

    app.appendChild(side); app.appendChild(main);
    document.body.appendChild(app); document.body.appendChild(backdrop);
  }

  function searchBox() {
    const results = el('div', { class: 'search-results', id: 'searchResults' });
    const input = el('input', { class: 'inp', type: 'search', placeholder: 'Search parts, codes, invoices…', 'aria-label': 'Search',
      oninput: e => runSearch(e.target.value, results),
      onblur: () => setTimeout(() => results.classList.remove('open'), 180) });
    return el('div', { class: 'search-box' }, [input, results]);
  }
  function runSearch(q, box) {
    const res = App.store.search(q);
    box.innerHTML = '';
    if (!q) { box.classList.remove('open'); return; }
    if (!res.length) { box.appendChild(el('div', { class: 'sr-item' }, 'No matches')); box.classList.add('open'); return; }
    const collToMod = { parts: 'parts', faults: 'diagnostics', service: 'service', workshops: 'workshops', suppliers: 'suppliers', inventory: 'inventory', documents: 'documents' };
    res.forEach(r => box.appendChild(el('div', { class: 'sr-item', onmousedown: () => { go(collToMod[r.coll] || 'command'); } }, [
      el('div', { class: 't', text: r.label }), el('div', { class: 'm', text: r.coll.toUpperCase() + (r.rec.oem ? ' · ' + r.rec.oem : '') })
    ])));
    box.classList.add('open');
  }

  function toggleSide() { $('#side').classList.toggle('open'); $('#backdrop').classList.toggle('open'); }
  function toggleTheme() {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); localStorage.setItem('gp-os-theme', next);
  }

  function go(id, force) {
    const mod = get(id) || get('command');
    if (current === mod.id && !force) return;
    current = mod.id;
    if (location.hash !== '#/' + id) history.replaceState(null, '', '#/' + id);
    App.util.$$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.id === mod.id));
    const crumb = $('#crumb'); if (crumb) crumb.innerHTML = 'GARAGE OS · <b>' + mod.label + '</b>';
    const view = $('#view'); view.innerHTML = ''; view.scrollTop = 0;
    mod.render(view);
    if (window.innerWidth <= 900) { $('#side').classList.remove('open'); $('#backdrop').classList.remove('open'); }
  }

  function start() {
    const saved = localStorage.getItem('gp-os-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved);
    buildShell();
    const id = (location.hash || '').replace('#/', '') || 'command';
    go(id, true);
    window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#/', ''); if (h && h !== current) go(h); });
    App.store.subscribe(() => { const b = $('#brandVeh'); const v = App.store.veh(); if (b) b.textContent = v.year + ' · ' + v.engine.split('(')[0].trim(); });
  }

  return { register, get, go, start, modules: () => modules };
})();

</script>

<script>
/* ==== js/modules/commandCenter.js ==== */
/* Command Center — at-a-glance dashboard for the active vehicle */
(function () {
  const { el } = App.util; const ui = App.ui;
  App.router.register({
    id: 'command', label: 'Command Center', group: 'Overview', icon: App.config.icon('command'),
    render(view) {
      const v = App.store.veh(); const d = v.data;
      const partsSpentPlan = d.parts.filter(p => p.verdict === 'buy').length;
      const openFaults = d.faults.filter(f => !f.solved).length;
      const critFaults = d.faults.filter(f => !f.solved && f.priority === 'critical').length;
      const totalSpent = d.installed.reduce((s, x) => s + (x.paid || 0), 0);
      const fuelAvg = avgConsumption(d.fuel);
      const alerts = App.notify.evaluate();

      view.appendChild(ui.secHead('01', 'Command Center', 'مركز القيادة'));

      // score dials
      const dials = el('div', { class: 'grid-3 stagger' }, [
        ui.dial(v.scores.health, 'Health', 'overall condition', 'var(--amber)'),
        ui.dial(v.scores.safety, 'Safety', 'airbag/ESP/CAN open', 'var(--rosso)'),
        ui.dial(v.scores.reliability, 'Reliability', 'major items fresh', 'var(--green)')
      ]);
      view.appendChild(dials);

      // stat tiles
      const tiles = el('div', { class: 'tiles stagger', style: 'margin-top:16px' });
      tiles.appendChild(ui.tile('Mileage', '', 'km', { count: v.mileage }));
      tiles.appendChild(ui.tile('Open Repairs', '', critFaults + ' critical', { count: openFaults, color: 'var(--rosso)' }));
      tiles.appendChild(ui.tile('To Buy', '', 'parts flagged BUY', { count: partsSpentPlan }));
      tiles.appendChild(ui.tile('Fuel', fuelAvg ? fuelAvg.toFixed(1) : '—', 'L/100km', { color: 'var(--steel)' }));
      tiles.appendChild(ui.tile('Invested', App.config.money(totalSpent), 'logged repairs'));
      tiles.appendChild(ui.tile('Phase', v.phase.split('—')[0], v.phase.split('—')[1] || ''));
      view.appendChild(tiles);

      // two columns: alerts + quick actions/upcoming
      const grid = el('div', { class: 'cc-grid', style: 'margin-top:16px' });

      const alertsCard = el('div', { class: 'card' }, [el('div', { class: 'spine', style: 'background:var(--rosso)' })]);
      const ab = el('div', { class: 'pad' }, [el('h3', { class: 'h-disp', style: 'font-size:16px;margin-bottom:8px', text: 'Critical Alerts' })]);
      if (!alerts.length) ab.appendChild(ui.empty('No alerts — all clear.'));
      alerts.slice(0, 8).forEach(a => ab.appendChild(el('div', { class: 'alert-row' }, [
        el('div', { class: 'alert-dot ' + (a.sev === 'crit' ? 'crit' : 'warn') }),
        el('div', {}, [el('div', { class: 'at', text: a.title }), el('div', { class: 'ad', text: a.detail })])
      ])));
      alertsCard.appendChild(ab);

      const rightCard = el('div', { class: 'card' }, [el('div', { class: 'spine', style: 'background:var(--ink)' })]);
      const rb = el('div', { class: 'pad' });
      rb.appendChild(el('h3', { class: 'h-disp', style: 'font-size:16px;margin-bottom:8px', text: 'Quick Actions' }));
      const qa = el('div', { class: 'qa' }, [
        el('button', { class: 'btn sm', onclick: () => App.router.go('fuel') }, '⛽ Add Refill'),
        el('button', { class: 'btn sm ghost', onclick: () => App.router.go('service') }, '📘 Log Service'),
        el('button', { class: 'btn sm ghost', onclick: () => App.router.go('parts') }, '⚙ Parts'),
        el('button', { class: 'btn sm ghost', onclick: () => App.router.go('diagnostics') }, '⚠ Faults')
      ]);
      rb.appendChild(qa);
      rb.appendChild(el('h3', { class: 'h-disp', style: 'font-size:16px;margin:16px 0 8px', text: 'Upcoming' }));
      const up = d.planner.filter(p => !p.done).slice(0, 4);
      if (!up.length) rb.appendChild(ui.empty('Nothing scheduled.'));
      up.forEach(p => rb.appendChild(el('div', { class: 'alert-row' }, [
        el('div', { class: 'alert-dot warn' }),
        el('div', {}, [el('div', { class: 'at', text: p.title }),
          el('div', { class: 'ad', text: (p.dueKm ? p.dueKm.toLocaleString() + ' km' : '') + (p.dueDate ? ' · ' + App.util.shortDate(p.dueDate) : '') })])
      ])));
      rightCard.appendChild(rb);

      grid.appendChild(alertsCard); grid.appendChild(rightCard);
      view.appendChild(grid);
    }
  });

  function avgConsumption(fuel) {
    if (!fuel || fuel.length < 2) return null;
    const s = fuel.slice().sort((a, b) => (a.km || 0) - (b.km || 0));
    let dist = 0, liters = 0;
    for (let i = 1; i < s.length; i++) { dist += (s[i].km - s[i - 1].km); liters += s[i].liters; }
    return dist > 0 ? (liters / dist) * 100 : null;
  }
  App._avgConsumption = avgConsumption;
})();

</script>

          el('span', { style: 'flex:0 0 20px;height:20px;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center;background:' + (saved[c[0]] ? 'var(--green)' : 'transparent') + ';color:#fff;font-size:13px', text: saved[c[0]] ? '✓' : '' }),

        ]);
        li.onclick = () => { saved[c[0]] = !saved[c[0]]; localStorage.setItem(CK, JSON.stringify(saved)); App.router.go('restoration', true); };
        list.appendChild(li);
      });
      return el('div', {}, [head, list]);
    }
  };

  function checkPct() { const s = load(); const d = CHECK.filter(c => s[c[0]]).length; return Math.round(d / CHECK.length * 100); }
  function load() { try { return JSON.parse(localStorage.getItem(CK)) || {}; } catch (e) { return {}; } }

  function priCard(cls, title, ar, badge, body) {
    return el('div', { class: 'card card-hover ' + cls }, [
      el('div', { class: 'spine', style: 'background:' + spineColor(cls) }),

        body ? el('div', { style: 'font-size:12.5px;color:#413a30;line-height:1.6;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px', text: body }) : null
      ])
    ]);
  }
  function spineColor(c) { return { 'p-crit': 'var(--rosso)', 'p-high': 'var(--amber)', 'p-med': 'var(--steel)' }[c] || 'var(--ink)'; }

  function alertCard() {
    return el('div', { class: 'card', style: 'margin-top:16px;border-color:var(--rosso)' }, [
      el('div', { style: 'background:var(--rosso);color:var(--paper);padding:8px 16px;font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px', text: 'عطل السلامة — الأسبوع ده' }),
      el('div', { class: 'pad rtl', style: 'font-size:13px;line-height:1.75', html: '<b>١)</b> تسريب قربة المياه ← قربة+غطاء+اختبار ضغط+Paraflu. <b>٢)</b> خرطوم السحب 51822558 (خطر التيربو). <b>٣)</b> كهربا الصدمة (CAN) — إصلاح أسلاك + بطارية، <b>مش موديول</b>.' })
    ]);
  }
  function beltCard() {
    const c = el('div', { class: 'card', style: 'margin-top:16px' });
    c.innerHTML = '<div class="pad"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><span class="h-disp" style="font-size:16px">⏱ Next Timing Belt</span><span class="mono" style="color:var(--amber);font-size:11px">DUE ~176,000 KM · OCT 2027</span></div>' +
      '<div class="meter" style="margin-top:12px;height:22px"><div class="fill f-red" style="width:63%"></div></div>' +
      '<div class="mono muted" style="font-size:11px;margin-top:8px">Done @112k. Bundle next: tensioner + water pump + accessory belt + coolant switch.</div></div>';
    return c;

})();

<script>

/* Parts Database — full CRUD with searchable/sortable/exportable table */
(function () {
  const { el } = App.util; const ui = App.ui;
  App.router.register({
    id: 'parts', label: 'Parts Database', group: 'Vehicle', icon: App.config.icon('parts'),
    render(view) {
      const rows = App.store.all('parts');
      view.appendChild(ui.secHead('03', 'Parts Database', 'قاعدة القطع'));

      const cats = Array.from(new Set(rows.map(r => r.category))).sort();
      const cols = [
        { key: 'verdict', label: '', render: r => ui.verdict(r.verdict), filter: ['buy', 'hold', 'stop', 'later'] },
        { key: 'name', label: 'Part', sort: true, render: r => el('div', {}, [el('b', { text: r.name }), el('div', { class: 'mono muted', style: 'font-size:10px', text: r.ar || '' })]) },
        { key: 'oem', label: 'OEM #', sort: true, render: r => el('span', { class: 'mono', style: 'color:var(--rosso-deep);font-weight:700', text: r.oem || '—' }) },
        { key: 'brand', label: 'Brand', sort: true },
        { key: 'category', label: 'Category', sort: true, filter: cats },
        { key: 'priceNewEg', label: 'New EGP', sort: true, render: r => r.priceNewEg ? App.util.num(r.priceNewEg) : '—' },
        { key: 'euRef', label: '🌍 EU' },
        { key: 'priority', label: 'Priority', sort: true, render: r => ui.priorityBadge(r.priority), filter: ['critical', 'high', 'medium', 'low', 'cosmetic'] },
        { key: 'vinOk', label: 'VIN', render: r => r.vinOk ? '✅' : el('span', { class: 'mono', style: 'color:var(--amber)', text: 'verify' }) }
      ];
      const dt = App.DataTable(cols, rows, {
        title: 'parts', pageSize: 14, searchKeys: ['name', 'ar', 'oem', 'brand', 'alt', 'notes', 'category'],
        onRow: r => openPart(r),
        actions: [{ label: '+ Add Part', cls: 'rosso', fn: () => openPart(null) }]
      });
      view.appendChild(dt);
    }
  });

  function openPart(rec) {
    const isNew = !rec; rec = rec || { verdict: 'buy', priority: 'medium', category: 'Engine', vinOk: false };
    const { el } = App.util;
    const f = (lb, key, val, type) => el('label', { class: 'fld' }, [el('span', { class: 'lb', text: lb }),
      el('input', { class: 'inp', type: type || 'text', value: rec[key] == null ? '' : rec[key], data: { key } })]);
    const body = el('div', {}, [
      f('Part name', 'name'), f('Arabic name', 'ar'), f('OEM number', 'oem'), f('Fiat number', 'fiat'),
      f('Alternative numbers', 'alt'), f('Brand', 'brand'),
      el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'Category' }),
        selectFrom('category', ['Engine', 'Cooling', 'Turbo', 'Suspension', 'Steering', 'Electrical', 'Brakes', 'Interior', 'Exterior', 'Body', 'Transmission', 'Accessories'], rec.category)]),
      f('Price new (EGP)', 'priceNewEg', null, 'number'), f('Price used (EGP)', 'priceUsedEg', null, 'number'),
      f('EU reference', 'euRef'), f('Supplier', 'supplier'), f('Compatibility', 'compat'), f('Warranty', 'warranty'),
      el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'Verdict' }), selectFrom('verdict', ['buy', 'hold', 'stop', 'later', 'installed'], rec.verdict)]),
      el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'Priority' }), selectFrom('priority', ['critical', 'high', 'medium', 'low', 'cosmetic'], rec.priority)]),
      el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'VIN verified' }), selectFrom('vinOk', ['false', 'true'], String(rec.vinOk))]),
      el('label', { class: 'fld' }, [el('span', { class: 'lb', text: 'Tags (comma)' }), el('input', { class: 'inp', value: (rec.tags || []).join(', '), data: { key: 'tags' } })]),

        el('button', { class: 'btn rosso', onclick: () => save() }, isNew ? 'Add Part' : 'Save'),

      ])
    ]);
    const m = App.util.modal(isNew ? 'New Part' : rec.name, body);
    function save() {
      const patch = {};
      body.querySelectorAll('[data-key]').forEach(i => {
        let val = i.value;
        if (i.dataset.key === 'tags') val = val.split(',').map(s => s.trim()).filter(Boolean);
        if (i.dataset.key === 'vinOk') val = val === 'true';
        if (['priceNewEg', 'priceUsedEg'].includes(i.dataset.key)) val = val === '' ? null : +val;
        patch[i.dataset.key] = val;
      });
      if (isNew) App.store.add('parts', patch); else App.store.update('parts', rec.id, patch);
      m.close(); App.router.go('parts', true); App.util.toast('Saved');
    }
  }
  function selectFrom(key, opts, cur) {
    const { el } = App.util;
    const s = el('select', { class: 'inp', data: { key } });
    opts.forEach(o => s.appendChild(el('option', { value: o, text: o, selected: String(cur) === String(o) ? 'selected' : null })));
    return s;
  }
  App._selectFrom = selectFrom;
})();
