<script>
/* ==== js/modules/fuel.js ==== */
/* Fuel Dashboard — refills, consumption, cost/km, trend chart (SVG) */
(function () {
  const { el } = App.util; const ui = App.ui; const money = App.config.money, num = App.util.num;
  App.router.register({
    id: 'fuel', label: 'Fuel Dashboard', group: 'Money', icon: App.config.icon('fuel'),
    render(view) {
      const d = App.store.veh().data;
      const fuel = d.fuel.slice().sort((a, b) => (a.km || 0) - (b.km || 0));
      view.appendChild(ui.secHead('06', 'Fuel Dashboard', 'لوحة البنزين'));

      // compute per-fill consumption
      const rows = [];
      let totLiters = 0, totCost = 0, totDist = 0;
      for (let i = 0; i < fuel.length; i++) {
        const f = fuel[i]; const prev = fuel[i - 1];
        const dist = prev ? f.km - prev.km : null;
        const cons = dist ? (f.liters / dist) * 100 : null;
        const total = f.liters * f.pricePerL;
        totLiters += f.liters; totCost += total; if (dist) totDist += dist;
        rows.push(Object.assign({}, f, { dist, cons, total }));
      }
      const avg = totDist ? (fuel.slice(1).reduce((s, x) => s + x.liters, 0) / totDist) * 100 : null;
      const costPerKm = totDist ? totCost / totDist : null;

      view.appendChild(el('div', { class: 'tiles', style: 'margin-bottom:16px' }, [
        ui.tile('Avg Consumption', avg ? avg.toFixed(1) : '—', 'L/100km', { color: avg > 8.5 ? 'var(--rosso)' : 'var(--green)' }),
        ui.tile('Cost / km', costPerKm ? money(costPerKm) : '—', ''),
        ui.tile('Total spent', money(totCost), num(totLiters) + ' L'),
        ui.tile('Target', '7–7.5', 'L/100km (spec)', { color: 'var(--steel)' })
      ]));

      // trend chart
      view.appendChild(chart(rows.filter(r => r.cons != null)));

      // table
      view.appendChild(el('h3', { class: 'h-disp', style: 'font-size:16px;margin:18px 0 10px', text: 'Refill Log' }));
      view.appendChild(App.DataTable([
        { key: 'date', label: 'Date', sort: true, render: r => App.util.shortDate(r.date) },
        { key: 'km', label: 'KM', sort: true, render: r => num(r.km) },
        { key: 'liters', label: 'Liters', sort: true },
        { key: 'pricePerL', label: '/L', render: r => money(r.pricePerL) },
        { key: 'total', label: 'Total', render: r => money(r.liters * r.pricePerL) },
        { key: 'cons', label: 'L/100km', sort: true, render: r => r.cons ? r.cons.toFixed(1) : '—' },
        { key: 'station', label: 'Station' }
      ], rows.slice().reverse(), { title: 'fuel', pageSize: 10, actions: [{ label: '+ Add Refill', cls: 'rosso', fn: addRefill }] }));
    }
  });

  function chart(data) {
    if (data.length < 2) return el('div', { class: 'card' }, [el('div', { class: 'pad' }, [ui.empty('Add at least 2 refills to see the consumption trend.')])]);
    const w = 640, h = 180, pad = 30;
    const vals = data.map(d => d.cons);
    const min = Math.min.apply(null, vals) - 0.5, max = Math.max.apply(null, vals) + 0.5;
    const x = i => pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = v => h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
    let path = '', dots = '';
    data.forEach((d, i) => { path += (i ? 'L' : 'M') + x(i) + ' ' + y(d.cons) + ' '; dots += `<circle cx="${x(i)}" cy="${y(d.cons)}" r="3.5" fill="var(--rosso)"/>`; });
    const target = y(7.25);
    const card = el('div', { class: 'card' });
    card.innerHTML = `<div class="pad"><div class="mono muted" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Consumption trend · L/100km</div>
      <div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:420px">
      <line x1="${pad}" y1="${target}" x2="${w - pad}" y2="${target}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/>
      <text x="${w - pad}" y="${target - 4}" text-anchor="end" font-family="monospace" font-size="9" fill="var(--green)">target 7.25</text>
      <path d="${path}" fill="none" stroke="var(--rosso)" stroke-width="2.5"/>${dots}</svg></div></div>`;
    return card;
  }

  function addRefill() {
    const { el } = App.util; const lastKm = (App.store.veh().mileage) || '';
    const body = el('div', {}, [
      lbl('Date', el('input', { class: 'inp', type: 'date', value: new Date().toISOString().slice(0, 10), data: { key: 'date' } })),
      lbl('Mileage (km)', el('input', { class: 'inp', type: 'number', value: lastKm, data: { key: 'km' } })),
      lbl('Liters', el('input', { class: 'inp', type: 'number', data: { key: 'liters' } })),
      lbl('Price / liter', el('input', { class: 'inp', type: 'number', value: '12.5', data: { key: 'pricePerL' } })),
      lbl('Station', el('input', { class: 'inp', data: { key: 'station' } })),
      lbl('Fuel type', el('input', { class: 'inp', value: '95', data: { key: 'type' } })),
      el('button', { class: 'btn rosso', style: 'margin-top:8px', onclick: save }, 'Add Refill')
    ]);
    const m = App.util.modal('New Refill', body);
    function save() {
      const p = {}; body.querySelectorAll('[data-key]').forEach(i => p[i.dataset.key] = i.type === 'number' ? +i.value : i.value);
      App.store.add('fuel', p);
      if (p.km) App.store.setVeh({ mileage: p.km });
      m.close(); App.router.go('fuel', true); App.util.toast('Refill added');
    }
    function lbl(t, n) { return el('label', { class: 'fld' }, [el('span', { class: 'lb', text: t }), n]); }
  }
})();

</script>
<script>
/* ==== js/modules/budget.js ==== */
/* Budget Manager — per-category budget/spent/remaining/forecast + bars */
(function () {
  const { el } = App.util; const ui = App.ui; const money = App.config.money;
  App.router.register({
    id: 'budget', label: 'Budget Manager', group: 'Money', icon: App.config.icon('budget'),
    render(view) {
      const d = App.store.veh().data;
      // derive spent from service history by rough category if not set; else use stored
      const cats = d.budget;
      const totalBudget = cats.reduce((s, c) => s + (c.budget || 0), 0);
      const totalSpent = cats.reduce((s, c) => s + (c.spent || 0), 0);
      view.appendChild(ui.secHead('07', 'Budget Manager', 'إدارة الميزانية'));

      view.appendChild(el('div', { class: 'tiles', style: 'margin-bottom:16px' }, [
        ui.tile('Planned', money(totalBudget), 'across categories'),
        ui.tile('Spent', money(totalSpent), '', { color: 'var(--green)' }),
        ui.tile('Remaining', money(totalBudget - totalSpent), '', { color: 'var(--amber)' }),
        ui.tile('Recommended', 'EGP 75–120k', 'full mechanical', { color: 'var(--steel)' })
      ]));

      const grid = el('div', { class: 'grid-2 stagger' });
      cats.forEach(c => {
        const pct = c.budget ? Math.min(100, (c.spent / c.budget) * 100) : 0;
        const over = c.spent > c.budget;
        const card = el('div', { class: 'card card-hover' }, [el('div', { class: 'spine', style: 'background:' + (over ? 'var(--rosso)' : 'var(--steel)') })]);
        const pad = el('div', { class: 'pad' }, [
          el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline' }, [
            el('span', { class: 'h-disp', style: 'font-size:15px', text: c.cat }),
            el('span', { class: 'mono', style: 'font-size:12px', text: money(c.spent) + ' / ' + money(c.budget) })
          ]),
          ui.meter(pct, over ? 'f-red' : 'f-steel'),
          el('div', { class: 'mono muted', style: 'font-size:10.5px;margin-top:6px', text: over ? 'Over by ' + money(c.spent - c.budget) : money(c.budget - c.spent) + ' remaining' })
        ]);
        // click to edit spent/budget
        pad.style.cursor = 'pointer';
        pad.addEventListener('click', () => edit(c));
        card.appendChild(pad); grid.appendChild(card);
      });
      view.appendChild(grid);
    }
  });

  function edit(c) {
    const { el } = App.util;
    const body = el('div', {}, [
      lbl('Category', el('input', { class: 'inp', value: c.cat, disabled: 'disabled' })),
      lbl('Budget (EGP)', el('input', { class: 'inp', type: 'number', value: c.budget, data: { key: 'budget' } })),
      lbl('Spent (EGP)', el('input', { class: 'inp', type: 'number', value: c.spent, data: { key: 'spent' } })),
      el('button', { class: 'btn rosso', style: 'margin-top:8px', onclick: save }, 'Save')
    ]);
    const m = App.util.modal('Budget · ' + c.cat, body);
    function save() { const p = {}; body.querySelectorAll('[data-key]').forEach(i => p[i.dataset.key] = +i.value); Object.assign(c, p); App.store.persist(); m.close(); App.router.go('budget', true); App.util.toast('Saved'); }
    function lbl(t, n) { return el('label', { class: 'fld' }, [el('span', { class: 'lb', text: t }), n]); }
  }
})();

</script>
<script>
/* ==== js/modules/insights.js ==== */
/* Insight modules — real screens bound to the shared data layer.
   Analytics + Roadmap are fully data-driven; Value, Photos, Search,
   AI Assistant have complete UI/data structure, expandable later. */
(function () {
  const { el } = App.util; const ui = App.ui; const money = App.config.money;

  /* ---- Analytics ---- */
  App.router.register({
    id: 'analytics', label: 'Analytics', group: 'Insights', icon: App.config.icon('analytics'),
    render(view) {
      const d = App.store.veh().data;
      view.appendChild(ui.secHead('15', 'Analytics', 'تحليلات'));
      // spend by year (from service)
      const byYear = {}; d.service.forEach(s => { const y = (s.date || '').slice(0, 4) || '?'; byYear[y] = (byYear[y] || 0) + (s.paid || 0); });
      view.appendChild(barChart('Repair spend by year (EGP)', Object.keys(byYear).sort().map(k => ({ label: k, val: byYear[k] }))));
      // spend by category (budget spent)
      view.appendChild(barChart('Budget spent by category', d.budget.filter(c => c.spent).map(c => ({ label: c.cat, val: c.spent }))));
      // most expensive repairs
      view.appendChild(el('h3', { class: 'h-disp', style: 'font-size:16px;margin:18px 0 10px', text: 'Most expensive repairs' }));
      const top = d.service.slice().sort((a, b) => (b.paid || 0) - (a.paid || 0)).slice(0, 6);
      view.appendChild(App.DataTable([{ key: 'work', label: 'Work', sort: true }, { key: 'date', label: 'Date', render: r => App.util.shortDate(r.date) }, { key: 'paid', label: 'Paid', sort: true, render: r => money(r.paid) }], top, { title: 'top-repairs', pageSize: 6 }));
    }
  });

  function barChart(title, data) {
    const card = el('div', { class: 'card', style: 'margin-bottom:16px' });
    const max = Math.max.apply(null, data.map(d => d.val).concat([1]));
    let bars = data.map(d => `<div style="display:flex;align-items:center;gap:10px;margin:6px 0">
      <span class="mono" style="width:64px;font-size:10px;color:var(--ink-soft);text-align:right">${d.label}</span>
      <div style="flex:1;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;height:18px;overflow:hidden">
        <div style="height:100%;width:${(d.val / max) * 100}%;background:repeating-linear-gradient(-45deg,var(--rosso-deep) 0 8px,var(--rosso) 8px 16px)"></div></div>
      <span class="mono" style="width:78px;font-size:11px">${App.util.num(d.val)}</span></div>`).join('');
    if (!data.length) bars = '<div class="empty">No data yet.</div>';
    card.innerHTML = `<div class="pad"><div class="mono muted" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px">${title}</div>${bars}</div>`;
    return card;
  }

  /* ---- Restoration Roadmap ---- */
  App.router.register({
    id: 'roadmap', label: 'Restoration Roadmap', group: 'Insights', icon: App.config.icon('roadmap'),
    render(view) {
      const d = App.store.veh().data;
      view.appendChild(ui.secHead('13', 'Restoration Roadmap', 'خريطة الترميم'));
      const grid = el('div', { class: 'grid-2 stagger' });
      d.roadmap.forEach(p => {
        const card = el('div', { class: 'card' }, [el('div', { class: 'spine', style: 'background:var(--rosso)' })]);
        card.appendChild(el('div', { class: 'pad' }, [
          el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline' }, [
            el('span', { class: 'h-disp', style: 'font-size:16px', text: 'Phase ' + p.phase + ' · ' + p.title }),
            el('span', { class: 'mono', style: 'font-size:12px', text: money(p.budget) })]),
          ui.meter(p.progress, p.progress >= 100 ? 'f-green' : 'f-amber'),
          el('div', { class: 'mono muted', style: 'font-size:11px;margin-top:6px', text: p.note })
        ]));
        grid.appendChild(card);
      });
      view.appendChild(grid);
    }
  });

  /* ---- Vehicle Value ---- */
  App.router.register({
    id: 'value', label: 'Vehicle Value', group: 'Insights', icon: App.config.icon('value'),
    render(view) {
      const v = App.store.veh(); const val = v.data.value;
      const invested = v.data.installed.reduce((s, x) => s + (x.paid || 0), 0) + (val.invested || 0);
      view.appendChild(ui.secHead('14', 'Vehicle Value', 'قيمة العربية'));
      view.appendChild(el('div', { class: 'tiles stagger' }, [
        ui.tile('Purchase', money(val.purchase), 'buy-in'),
        ui.tile('Invested', money(invested), 'repairs to date', { color: 'var(--green)' }),
        ui.tile('Repairs ahead', money(val.repairEstimate), 'Phase 1–2 est.', { color: 'var(--amber)' }),
        ui.tile('Est. resale', money(val.estResale), 'after restoration', { color: 'var(--steel)' })
      ]));
      const net = val.estResale - val.purchase - invested - val.repairEstimate;
      view.appendChild(el('div', { class: 'card', style: 'margin-top:16px' }, [el('div', { class: 'pad' }, [
        el('div', { class: 'mono muted', style: 'font-size:10px;letter-spacing:.14em;text-transform:uppercase', text: 'Position after full restoration' }),
        el('div', { class: 'h-disp', style: 'font-size:26px;margin-top:4px;color:' + (net >= 0 ? 'var(--green)' : 'var(--rosso)'), text: (net >= 0 ? '+' : '') + money(net) }),
        el('div', { class: 'mono muted', style: 'font-size:11px;margin-top:4px', text: 'Note: a well-documented restoration protects value more than it profits — the dossier is the asset.' })
      ])]));
    }
  });

  /* ---- Photo Timeline ---- */
  App.router.register({
    id: 'photos', label: 'Photo Timeline', group: 'Archive', icon: App.config.icon('photos'), soon: true,
    render(view) {
      const d = App.store.veh().data;
      view.appendChild(ui.secHead('12', 'Photo Timeline', 'ألبوم قبل / بعد'));
      view.appendChild(el('div', { class: 'card', style: 'margin-bottom:16px' }, [el('div', { class: 'pad mono muted', style: 'font-size:11.5px', text: 'Before / during / after per repair. Attach images to any record (data model ready: record.attachments[]).' })]));
      ['before', 'during', 'after'].forEach(stage => {
        const items = d.photos.filter(p => p.stage === stage);
        view.appendChild(el('h3', { class: 'h-disp', style: 'font-size:15px;margin:14px 0 8px', text: stage.toUpperCase() }));
        const g = el('div', { class: 'grid-3' });
        if (!items.length) g.appendChild(ui.empty('No ' + stage + ' photos linked.'));
        items.forEach(p => g.appendChild(el('div', { class: 'card' }, [el('div', { class: 'pad' }, [el('div', { style: 'height:80px;border:1.5px dashed var(--line-strong);border-radius:6px;display:grid;place-items:center;color:var(--ink-soft)', text: '🖼' }), el('div', { style: 'font-size:12px;margin-top:6px', text: p.label }), el('div', { class: 'mono muted', style: 'font-size:10px', text: p.date })])])));
        view.appendChild(g);
      });
    }
  });

  /* ---- Search (dedicated page) ---- */
  App.router.register({
    id: 'search', label: 'Search Engine', group: 'Archive', icon: App.config.icon('search'),
    render(view) {
      view.appendChild(ui.secHead('16', 'Global Search', 'بحث شامل'));
      const out = el('div');
      const input = el('input', { class: 'inp', type: 'search', placeholder: 'Search parts, OEM, fault codes, invoices, workshops…', style: 'max-width:420px', oninput: e => run(e.target.value) });
      view.appendChild(input); view.appendChild(el('div', { style: 'height:14px' })); view.appendChild(out);
      function run(q) {
        const res = App.store.search(q); out.innerHTML = '';
        if (!q) { out.appendChild(ui.empty('Type to search everything in this vehicle.')); return; }
        if (!res.length) { out.appendChild(ui.empty('No matches.')); return; }
        const collToMod = { parts: 'parts', faults: 'diagnostics', service: 'service', workshops: 'workshops', suppliers: 'suppliers', inventory: 'inventory', documents: 'documents' };
        res.forEach(r => out.appendChild(el('div', { class: 'card card-hover', style: 'margin-bottom:8px;cursor:pointer', onclick: () => App.router.go(collToMod[r.coll]) }, [
          el('div', { class: 'pad' }, [el('b', { text: r.label }), el('span', { class: 'mono muted', style: 'float:right;font-size:10px', text: r.coll.toUpperCase() }), r.rec.oem ? el('div', { class: 'mono', style: 'font-size:11px;color:var(--rosso)', text: r.rec.oem }) : null])
        ])));
      }
      run('');
    }
  });

  /* ---- AI Assistant (UI only; no AI wired) ---- */
  App.router.register({
    id: 'assistant', label: 'AI Assistant', group: 'Insights', icon: App.config.icon('assistant'), soon: true,
    render(view) {
      view.appendChild(ui.secHead('17', 'AI Maintenance Advisor', 'مستشار الصيانة'));
      view.appendChild(el('div', { class: 'card', style: 'margin-bottom:14px' }, [el('div', { class: 'pad mono muted', style: 'font-size:11.5px', html: '🧠 Extension point — UI ready, no AI wired yet (flag <code>aiAdvisor</code>). It will reason over the same data layer (parts, faults, fuel, budget).' })]));
      const qs = ['Why is fuel consumption increasing?', 'What should I repair first?', 'What can safely wait?', 'Am I over budget in any category?'];
      const chat = el('div', { class: 'card' }, [el('div', { class: 'pad' })]);
      const pad = chat.querySelector('.pad');
      qs.forEach(q => pad.appendChild(el('button', { class: 'btn sm ghost', style: 'margin:0 6px 8px 0', onclick: () => answer(q) }, q)));
      const ans = el('div', { style: 'margin-top:10px' }); pad.appendChild(ans);
      view.appendChild(chat);
      function answer(q) {
        const d = App.store.veh().data; let txt = '';
        if (/fuel/i.test(q)) txt = 'Top suspects from your data: torn intake hose (51822558), overdue plugs, then a smoke test + fuel-trim read. Fix the hose first and re-measure.';
        else if (/first/i.test(q)) txt = 'Critical open faults: ' + d.faults.filter(f => !f.solved && f.priority === 'critical').map(f => f.code).join(', ') + '. Start with the rear-harness wiring (B1023) + coolant leak + intake hose.';
        else if (/wait/i.test(q)) txt = 'Safe to defer: radiator (pending pressure test), front shocks (inspect first), all Phase 2–3 cosmetic items.';
        else txt = 'Categories over budget: ' + (d.budget.filter(c => c.spent > c.budget).map(c => c.cat).join(', ') || 'none yet') + '.';
        ans.innerHTML = '<div class="card" style="border-color:var(--steel)"><div class="pad" style="font-size:13px;line-height:1.6"><b class="mono" style="color:var(--steel)">ADVISOR ·</b> ' + txt + '</div></div>';
      }
    }
  });
})();

</script>
<script>
/* ==== js/modules/settings.js ==== */
/* Settings — vehicle profile, preferences, backup/restore, feature
   flags (future extension points), notifications overview. */
(function () {
  const { el } = App.util; const ui = App.ui; const cfg = App.config;
  App.router.register({
    id: 'settings', label: 'Settings', group: 'Insights', icon: cfg.icon('settings'),
    render(view) {
      view.appendChild(ui.secHead('', 'Settings', 'الإعدادات'));
      const v = App.store.veh();

      /* vehicle profile */
      view.appendChild(section('Vehicle Profile', vehForm(v)));

      /* preferences */
      const c = cfg.get();
      const pref = el('div', { class: 'grid-3' }, [
        prefSelect('Theme', ['light', 'dark'], c.theme.mode, val => { cfg.setPath('theme', 'mode', val); document.documentElement.setAttribute('data-theme', val); localStorage.setItem('gp-os-theme', val); }),
        prefSelect('Language', ['en', 'ar'], c.locale.language, val => cfg.setPath('locale', 'language', val)),
        prefSelect('Distance', ['km', 'mi'], c.units.distance, val => cfg.setPath('units', 'distance', val)),
        prefText('Currency symbol', c.currency.symbol, val => cfg.setPath('currency', 'symbol', val)),

        prefText('Timing belt (km)', c.reminders.timingBeltKm, val => cfg.setPath('reminders', 'timingBeltKm', +val))
      ]);
      view.appendChild(section('Preferences', pref));

      /* backup / restore */
      const backupUI = el('div', {}, [
        el('div', { class: 'qa', style: 'margin-bottom:12px' }, [
          el('button', { class: 'btn sm', onclick: exportBackup }, '⇩ Export JSON backup'),
          el('button', { class: 'btn sm ghost', onclick: importBackup }, '⇧ Import JSON'),
          el('button', { class: 'btn sm ghost', onclick: () => { App.store.snapshot('manual'); App.util.toast('Snapshot saved'); App.router.go('settings', true); } }, '📸 Snapshot now'),
          el('button', { class: 'btn sm ghost', onclick: () => { if (confirm('Reset ALL data to seed?')) { App.store.reset(); location.reload(); } } }, '⟲ Factory reset')
        ]),
        backupList()
      ]);
      view.appendChild(section('Backup & Restore', backupUI));

      /* cloud sync (Supabase) */
      view.appendChild(section('Cloud Sync — Supabase', cloudForm()));

      /* future extension points */
      const flags = c.features;
      const fl = el('div', { class: 'grid-2' });
      [['obdLive', 'OBD-II Live Diagnostics'], ['aiAdvisor', 'AI Maintenance Advisor'], ['expenseForecast', 'Expense Forecasting'], ['vinDecoder', 'VIN Decoder'], ['ocrInvoice', 'OCR Invoice Scanner'], ['barcodeScanner', 'Barcode / QR Parts Scanner'], ['cloudSync', 'Cloud Sync'], ['multiUser', 'Multi-user Collaboration']].forEach(f => {
        fl.appendChild(el('label', { class: 'card', style: 'display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer' }, [
          el('span', { text: f[1] }),
          (function () { const cb = el('input', { type: 'checkbox', checked: flags[f[0]] ? 'checked' : null }); cb.onchange = () => { cfg.setPath('features', f[0], cb.checked); App.util.toast(f[1] + (cb.checked ? ' enabled (stub)' : ' disabled')); }; return cb; })()
        ]));

    }
  });

  function cloudForm() {
    const c = cfg.get(); const cl = c.cloud;
    const fields = [['url', 'Supabase Project URL', 'https://xxxx.supabase.co'], ['anonKey', 'Anon public key', 'eyJ...'], ['table', 'Table name', 'garage_state'], ['rowId', 'Row id', 'gp-tjet-2010']];
    const body = el('div', { class: 'grid-2' });
    fields.forEach(f => body.appendChild(el('label', { class: 'fld' }, [el('span', { class: 'lb', text: f[1] }), el('input', { class: 'inp', value: cl[f[0]] || '', placeholder: f[2], data: { key: f[0] } })])));
    const status = el('div', { class: 'mono muted', style: 'font-size:11px;margin:6px 0' , text: 'Status: ' + (App.sync.status().enabled ? 'ENABLED' : (App.sync.status().ready ? 'configured (flag off)' : 'not configured')) });
    const toggle = el('label', { class: 'fld', style: 'display:flex;gap:8px;align-items:center' }, [
      (function () { const cb = el('input', { type: 'checkbox', checked: c.features.cloudSync ? 'checked' : null, data: { key: '_enable' } }); return cb; })(),
      el('span', { class: 'lb', style: 'margin:0', text: 'Enable cloud sync (feature flag)' })
    ]);
    const wrap = el('div', {}, [
      el('div', { class: 'mono muted', style: 'font-size:11.5px;margin-bottom:10px', html: 'Free Supabase + Cloudflare. Paste your project URL & anon key, run the SQL in <b>HOSTING.md</b>, enable the flag, Save. Data then syncs across devices. Anon key is public — keep the site behind Cloudflare Access.' }),
      body, toggle, status,
      el('div', { class: 'qa' }, [
        el('button', { class: 'btn sm rosso', onclick: save }, 'Save cloud config'),
        el('button', { class: 'btn sm ghost', onclick: doTest }, '🔌 Test connection'),
        el('button', { class: 'btn sm ghost', onclick: async () => { const r = await App.sync.push(); App.util.toast(r.ok ? 'Pushed to cloud ↑' : 'Push failed: ' + r.reason); } }, '↑ Push now'),
        el('button', { class: 'btn sm ghost', onclick: async () => { const r = await App.sync.pull(); if (r.ok && r.data) { App.store.adopt(r.data); App.util.toast('Pulled ↓'); App.router.go('settings', true); } else App.util.toast('Pull: ' + (r.reason || (r.empty ? 'no cloud row yet' : 'ok'))); } }, '↓ Pull now')
      ])
    ]);
    function save() {
      const patch = {};
      body.querySelectorAll('[data-key]').forEach(i => patch[i.dataset.key] = i.value.trim());
      cfg.set({ cloud: Object.assign({}, cl, patch) });
      cfg.setPath('features', 'cloudSync', toggle.querySelector('input').checked);
      App.util.toast('Cloud config saved'); App.sync.init(); App.router.go('settings', true);
    }
    async function doTest() { const r = await App.sync.test(); App.util.toast(r.ok ? (r.empty ? 'Connected ✓ (no row yet)' : 'Connected ✓ cloud row found') : 'Failed: ' + (r.reason || 'check URL/key/RLS')); }
    return wrap;
  }

  function section(title, node) {
    return el('details', { class: 'exp', open: 'open' }, [el('summary', { text: title }), el('div', { class: 'exp-body' }, [node])]);
  }
  function vehForm(v) {
    const fields = [['make', 'Make'], ['model', 'Model'], ['year', 'Year'], ['vin', 'VIN'], ['engine', 'Engine'], ['transmission', 'Transmission'], ['mileage', 'Mileage (km)'], ['wheels', 'Wheels'], ['insuranceExpiry', 'Insurance expiry (date)'], ['licenseExpiry', 'License expiry (date)']];
    const body = el('div', { class: 'grid-3' });
    fields.forEach(f => body.appendChild(el('label', { class: 'fld' }, [el('span', { class: 'lb', text: f[1] }), el('input', { class: 'inp', value: v[f[0]] == null ? '' : v[f[0]], data: { key: f[0] } })])));
    const wrap = el('div', {}, [body, el('button', { class: 'btn rosso', style: 'margin-top:8px', onclick: () => { const p = {}; body.querySelectorAll('[data-key]').forEach(i => p[i.dataset.key] = i.dataset.key === 'mileage' || i.dataset.key === 'year' ? +i.value : i.value); App.store.setVeh(p); App.util.toast('Vehicle saved'); } }, 'Save Vehicle')]);
    return wrap;
  }
  function prefSelect(label, opts, cur, fn) {
    const s = App._selectFrom('x', opts, cur); s.onchange = () => fn(s.value);
    return el('label', { class: 'fld' }, [el('span', { class: 'lb', text: label }), s]);
  }
  function prefText(label, cur, fn) {
    const i = el('input', { class: 'inp', value: cur }); i.onchange = () => fn(i.value);
    return el('label', { class: 'fld' }, [el('span', { class: 'lb', text: label }), i]);
  }
  function exportBackup() {
    const a = el('a', { href: 'data:application/json;charset=utf-8,' + encodeURIComponent(App.store.exportJSON()), download: 'garage-os-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.appendChild(a); a.click(); a.remove(); App.util.toast('Backup exported');
  }
  function importBackup() {
    const inp = el('input', { type: 'file', accept: '.json', style: 'display:none' });
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { App.store.importJSON(r.result); App.util.toast('Restored'); location.reload(); } catch (e) { App.util.toast('Invalid file'); } }; r.readAsText(f); };
    document.body.appendChild(inp); inp.click(); inp.remove();
  }
  function backupList() {
    const list = App.store.backups();
    if (!list.length) return ui.empty('No snapshots yet.');
    return App.DataTable([
      { key: 'at', label: 'When', render: r => App.util.shortDate(r.at) + ' ' + new Date(r.at).toLocaleTimeString() },
      { key: 'label', label: 'Label' },
      { key: '_r', label: '', render: r => el('button', { class: 'btn sm ghost', onclick: () => { if (confirm('Restore this snapshot?')) { App.store.restoreBackup(r.at); location.reload(); } } }, 'Restore') }
    ], list, { title: 'backups', pageSize: 5 });
  }
})();

</script>

<script>
/* ==== js/app.js ==== */
/* ============================================================
   Bootstrap — load config + store, mount router, wire the
   notification bell. Modules self-register on load (they run
   before this file per the include order in index.html/build).
   ============================================================ */
(function () {
  App.config.load();
  App.store.load();
  // auto-snapshot once per session for safety
  try { App.store.snapshot('session-open'); } catch (e) { }

  App.router.start();
  wireBell();

  // cloud sync (no-op unless configured + enabled in Settings)
  try { App.sync.init(); } catch (e) { }

  App.store.subscribe(() => updateBell());

  function wireBell() {
    const { el } = App.util;
    const topbar = App.util.$('.topbar');
    if (!topbar) return;
    const panel = el('div', { class: 'notif-panel', id: 'notifPanel' });
    const btn = el('button', { class: 'icon-btn bell', 'aria-label': 'Notifications', onclick: () => { renderPanel(panel); panel.classList.toggle('open'); } }, App.config.icon('notifications'));
    const wrap = el('div', { style: 'position:relative' }, [btn, panel]);
    // insert before theme button (after search)
    const spacer = topbar.querySelector('.spacer');
    topbar.insertBefore(wrap, spacer.nextSibling.nextSibling || null);
    document.addEventListener('click', e => { if (!wrap.contains(e.target)) panel.classList.remove('open'); });
    updateBell();
  }
  function updateBell() {
    const btn = App.util.$('.bell'); if (!btn) return;
    const n = App.notify.count();
    let dot = btn.querySelector('.dot');
    if (n > 0) { if (!dot) { dot = App.util.el('span', { class: 'dot' }); btn.appendChild(dot); } dot.textContent = n; }
    else if (dot) dot.remove();
  }
  function renderPanel(panel) {
    const { el } = App.util;
    const alerts = App.notify.evaluate();
    panel.innerHTML = '';
    panel.appendChild(el('div', { style: 'padding:10px 12px;border-bottom:1.5px solid var(--ink)', class: 'h-disp', text: 'Notifications (' + alerts.length + ')' }));
    if (!alerts.length) panel.appendChild(el('div', { class: 'pad muted mono', style: 'font-size:12px', text: 'All clear.' }));
    alerts.forEach(a => panel.appendChild(el('div', { class: 'sr-item' }, [
      el('div', { class: 't', text: a.title }), el('div', { class: 'm', text: (a.kind || '').toUpperCase() + ' · ' + a.detail })
    ])));
  }

  // keyboard: '/' focuses search
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      const s = App.util.$('.search-box input'); if (s) { e.preventDefault(); s.focus(); }
    }
  });
})();

</script>
